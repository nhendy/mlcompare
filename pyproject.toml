[project]
name = "mlcompare"
version = "0.2.0"
description = "W&B-style dashboard for comparing ML experiments logged as CSV + config.yaml"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "polars>=1.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.10",
]

[project.scripts]
mlcompare = "mlcompare.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.8",
    "pytest>=8.0",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcompare"]
artifacts = ["src/mlcompare/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstring style not enforced everywhere
    "CPY001",  # no per-file copyright headers
    "COM812",  # conflicts with formatter
    "ISC001",  # conflicts with formatter
    "T201",    # print is fine in CLI/scripts
    "FBT001",
    "FBT002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]
"examples/**" = ["INP001", "S311"]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
